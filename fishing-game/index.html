<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rybak przy moście</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1a2a; overflow: hidden; touch-action: none; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Rybak przy moście: przytrzymaj, aby naładować rzut, puść, aby zarzucić.
// Gdy spławik zanurkuje, dotknij szybko. Potem trzymaj, aby zwijać, puszczaj, gdy linka jest za napięta.
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, DPR, WATER;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  WATER = H * 0.42;
}
window.addEventListener('resize', resize);
resize();

const SPECIES = [
  { name: 'Płotka',  color: '#c9d6df', fin: '#e05a47', len: 26, speed: 40, pts: 10, fight: 0.6, weight: 5 },
  { name: 'Okoń',    color: '#9bbf4f', fin: '#ff7b2e', len: 30, speed: 50, pts: 20, fight: 0.9, weight: 4 },
  { name: 'Karp',    color: '#d9a441', fin: '#b5651d', len: 44, speed: 30, pts: 35, fight: 1.2, weight: 3 },
  { name: 'Pstrąg',  color: '#a9b8c8', fin: '#e88aa0', len: 36, speed: 70, pts: 45, fight: 1.4, weight: 2 },
  { name: 'Szczupak',color: '#6f8f3a', fin: '#c7b04a', len: 62, speed: 85, pts: 80, fight: 2.0, weight: 1 },
];

const rnd = (a, b) => a + Math.random() * (b - a);
function pickSpecies() {
  const total = SPECIES.reduce((s, x) => s + x.weight, 0);
  let r = Math.random() * total;
  for (const s of SPECIES) { if ((r -= s.weight) < 0) return s; }
  return SPECIES[0];
}

const fish = [];
function spawnFish() {
  const sp = pickSpecies();
  const dir = Math.random() < 0.5 ? 1 : -1;
  fish.push({
    sp, dir,
    x: dir > 0 ? -60 : W + 60,
    y: rnd(WATER + 40, H - 40),
    phase: rnd(0, 6.28),
    speed: sp.speed * rnd(0.7, 1.3),
    interest: 0,
  });
}
for (let i = 0; i < 6; i++) { spawnFish(); fish[i].x = rnd(0, W); }

const bubbles = Array.from({ length: 25 }, () => ({ x: rnd(0, 1), y: rnd(0, 1), r: rnd(1, 3.5), s: rnd(10, 30) }));

// state: idle | charging | flying | waiting | bite | reeling | caught | lost
const g = {
  state: 'idle', power: 0, score: 0, catches: 0, best: 0,
  bob: { x: 0, y: 0, vx: 0, vy: 0, sink: 0 },
  hooked: null, biter: null, biteT: 0,
  tension: 0, dist: 0, msg: '', msgT: 0, holding: false, t: 0,
};
try { g.best = +localStorage.getItem('fish-best') || 0; } catch (e) {}

function rodTip() { return { x: W * 0.78, y: WATER - H * 0.2 }; }
function say(m, t = 2) { g.msg = m; g.msgT = t; }

function press() {
  g.holding = true;
  if (g.state === 'idle') { g.state = 'charging'; g.power = 0; }
  else if (g.state === 'bite') startReel();
  else if (g.state === 'waiting') { g.state = 'idle'; say('Zwinięte'); }
  else if (g.state === 'caught' || g.state === 'lost') { g.state = 'idle'; g.hooked = null; }
}
function release() {
  g.holding = false;
  if (g.state === 'charging') cast();
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);
window.addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat) press(); });
window.addEventListener('keyup', e => { if (e.code === 'Space') release(); });

function cast() {
  const tip = rodTip();
  const p = Math.max(0.15, g.power);
  g.bob = { x: tip.x, y: tip.y, vx: -(150 + p * W * 0.9), vy: -260 * p - 80, sink: 0 };
  g.state = 'flying';
}

function startReel() {
  const f = g.biter;
  g.hooked = f;
  fish.splice(fish.indexOf(f), 1);
  g.tension = 0.3; g.dist = 1;
  g.state = 'reeling';
}

function update(dt) {
  g.t += dt;
  if (g.msgT > 0) g.msgT -= dt;
  if (fish.length < 7 && Math.random() < dt * 0.6) spawnFish();

  for (const b of bubbles) { b.y -= b.s * dt / H; if (b.y < WATER / H) { b.y = 1; b.x = rnd(0, 1); } }

  const b = g.bob;
  const hookY = WATER + 70;

  for (let i = fish.length - 1; i >= 0; i--) {
    const f = fish[i];
    f.phase += dt * 6;
    const lured = g.state === 'waiting' && f !== g.biter && Math.abs(f.x - b.x) < 160;
    if (lured && !g.biter) {
      f.interest += dt * rnd(0.2, 0.8);
      const tx = b.x, ty = hookY;
      f.dir = tx > f.x ? 1 : -1;
      f.x += (tx - f.x) * dt * 0.8;
      f.y += (ty - f.y) * dt * 0.8;
      if (f.interest > 1 && Math.hypot(f.x - tx, f.y - ty) < 25) {
        g.biter = f; g.state = 'bite'; g.biteT = 0.9 - f.sp.fight * 0.15;
      }
    } else if (f !== g.biter) {
      f.x += f.dir * f.speed * dt;
      f.y += Math.sin(f.phase * 0.3) * 10 * dt;
    }
    f.y = Math.max(WATER + 25, Math.min(H - 20, f.y));
    if (f.x < -100 || f.x > W + 100) fish.splice(i, 1);
  }

  if (g.state === 'charging') g.power = Math.min(1, g.power + dt * 0.9);
  if (g.state === 'flying') {
    b.vy += 600 * dt; b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.x < 20) { b.x = 20; b.vx = 0; }
    if (b.y >= WATER) { b.y = WATER; g.state = 'waiting'; say('Czekaj na branie...', 1.5); }
  }
  if (g.state === 'waiting') b.sink = Math.sin(g.t * 2) * 2;
  if (g.state === 'bite') {
    b.sink = 8 + Math.sin(g.t * 30) * 4;
    g.biteT -= dt;
    if (g.biteT <= 0) {
      g.biter.dir = Math.random() < 0.5 ? 1 : -1; g.biter.interest = -2;
      g.biter = null; g.state = 'waiting'; say('Uciekła! Za wolno.');
    }
  }
  if (g.state === 'reeling') {
    const f = g.hooked.sp;
    const pull = (Math.sin(g.t * (2 + f.fight)) * 0.5 + 0.6) * f.fight;
    if (g.holding) { g.tension += dt * (0.25 + pull * 0.45); g.dist -= dt * 0.18 / (0.6 + f.fight * 0.4); }
    else { g.tension -= dt * 0.55; g.dist += dt * 0.04 * f.fight; }
    g.tension = Math.max(0, g.tension);
    g.dist = Math.min(1.2, g.dist);
    const tip = rodTip();
    b.x = tip.x - (tip.x - Math.max(20, b.x)) * 0.999 + Math.sin(g.t * 5) * 20 * dt;
    b.sink = 6 + Math.sin(g.t * 12) * 3;
    if (g.tension >= 1) { g.state = 'lost'; g.biter = null; say('Linka pękła!', 2.5); }
    else if (g.dist >= 1.2) { g.state = 'lost'; g.biter = null; say('Ryba się zerwała!', 2.5); }
    else if (g.dist <= 0) {
      g.state = 'caught'; g.biter = null;
      g.score += f.pts; g.catches++;
      if (g.score > g.best) { g.best = g.score; try { localStorage.setItem('fish-best', g.best); } catch (e) {} }
      say(`Złowiono: ${f.name}! +${f.pts}`, 3);
    }
  }
}

// ---------- drawing ----------
function drawFish(x, y, sp, dir, phase, scale = 1) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(dir * scale, scale);
  const L = sp.len, wag = Math.sin(phase) * 0.35;
  ctx.fillStyle = sp.fin;
  ctx.beginPath();
  ctx.moveTo(-L * 0.45, 0);
  ctx.lineTo(-L * 0.8, -L * 0.25 + wag * L * 0.3);
  ctx.lineTo(-L * 0.8, L * 0.25 + wag * L * 0.3);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = sp.color;
  ctx.beginPath(); ctx.ellipse(0, 0, L * 0.5, L * 0.22, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = sp.fin;
  ctx.beginPath(); ctx.moveTo(-L * 0.1, -L * 0.2); ctx.lineTo(L * 0.1, -L * 0.33); ctx.lineTo(L * 0.18, -L * 0.18); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(L * 0.3, -L * 0.05, L * 0.06, 0, 7); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(L * 0.32, -L * 0.05, L * 0.03, 0, 7); ctx.fill();
  ctx.restore();
}

function drawScene() {
  // sky
  let gr = ctx.createLinearGradient(0, 0, 0, WATER);
  gr.addColorStop(0, '#f6a96b'); gr.addColorStop(0.6, '#f8d8a0'); gr.addColorStop(1, '#bfe0e8');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, WATER);
  ctx.fillStyle = '#fff3c4'; ctx.beginPath(); ctx.arc(W * 0.25, WATER * 0.45, 34, 0, 7); ctx.fill();
  // hills
  ctx.fillStyle = '#6b8e5a';
  ctx.beginPath(); ctx.moveTo(0, WATER);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, WATER - 40 - Math.sin(x * 0.01) * 25 - Math.sin(x * 0.027) * 12);
  ctx.lineTo(W, WATER); ctx.fill();

  // water (aquarium-like cross-section)
  gr = ctx.createLinearGradient(0, WATER, 0, H);
  gr.addColorStop(0, '#3a8fb0'); gr.addColorStop(1, '#0d2c45');
  ctx.fillStyle = gr; ctx.fillRect(0, WATER, W, H - WATER);
  // light rays
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for (let i = 0; i < 5; i++) {
    const x = (i * W / 4 + g.t * 8) % (W + 200) - 100;
    ctx.beginPath(); ctx.moveTo(x, WATER); ctx.lineTo(x + 60, WATER); ctx.lineTo(x + 160, H); ctx.lineTo(x + 40, H); ctx.fill();
  }
  // bottom: sand, stones, weeds
  ctx.fillStyle = '#5c4a32';
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 30) ctx.lineTo(x, H - 18 - Math.sin(x * 0.03) * 6);
  ctx.lineTo(W, H); ctx.fill();
  ctx.strokeStyle = '#2f7a3d'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (let i = 0; i < 14; i++) {
    const x = (i * 97) % W + 15, h = 40 + (i * 37) % 60;
    ctx.beginPath(); ctx.moveTo(x, H - 15);
    ctx.quadraticCurveTo(x + Math.sin(g.t * 1.5 + i) * 14, H - 15 - h / 2, x + Math.sin(g.t * 1.5 + i + 1) * 10, H - 15 - h);
    ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  for (const b of bubbles) { ctx.beginPath(); ctx.arc(b.x * W + Math.sin(g.t + b.y * 20) * 4, b.y * H, b.r, 0, 7); ctx.fill(); }

  // bridge (stone arch, left side)
  const bx = W * 0.05, bw = W * 0.5, deck = WATER - 70;
  ctx.fillStyle = '#8a8178';
  ctx.fillRect(bx, deck, bw, 22);
  ctx.beginPath();
  ctx.moveTo(bx, deck + 22); ctx.lineTo(bx, WATER + 30);
  ctx.lineTo(bx + 30, WATER + 30);
  ctx.quadraticCurveTo(bx + bw / 2, deck - 10, bx + bw - 30, WATER + 30);
  ctx.lineTo(bx + bw, WATER + 30); ctx.lineTo(bx + bw, deck + 22); ctx.fill();
  ctx.strokeStyle = '#5e564f'; ctx.lineWidth = 2;
  for (let x = bx + 10; x < bx + bw; x += 26) ctx.strokeRect(x, deck + 4, 22, 14);
  ctx.fillStyle = '#6f675f';
  for (let x = bx; x <= bx + bw; x += 20) ctx.fillRect(x, deck - 18, 5, 18);
  ctx.fillRect(bx, deck - 20, bw, 4);

  // bank (right) with fisherman
  ctx.fillStyle = '#7a5b3a';
  ctx.beginPath(); ctx.moveTo(W * 0.72, WATER); ctx.lineTo(W * 0.8, WATER - 40); ctx.lineTo(W, WATER - 40); ctx.lineTo(W, WATER + 30); ctx.fill();
  ctx.fillStyle = '#5f8a3a'; ctx.fillRect(W * 0.8, WATER - 46, W * 0.2, 8);
  const mx = W * 0.88, my = WATER - 46;
  ctx.fillStyle = '#2d4a6b'; ctx.fillRect(mx - 8, my - 30, 16, 30);           // legs/body
  ctx.fillStyle = '#c0392b'; ctx.fillRect(mx - 10, my - 58, 20, 30);          // jacket
  ctx.fillStyle = '#f1c27d'; ctx.beginPath(); ctx.arc(mx, my - 68, 9, 0, 7); ctx.fill();
  ctx.fillStyle = '#3d5229'; ctx.fillRect(mx - 13, my - 78, 26, 5); ctx.fillRect(mx - 8, my - 86, 16, 9); // hat

  // rod
  const tip = rodTip();
  const bend = g.state === 'reeling' ? 25 * (0.5 + g.tension) : g.state === 'charging' ? -15 * g.power : 0;
  ctx.strokeStyle = '#3b2a1a'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(mx - 6, my - 45);
  ctx.quadraticCurveTo((mx + tip.x) / 2, (my - 45 + tip.y) / 2 - 10 + bend, tip.x, tip.y + bend);
  ctx.stroke();

  // line + bobber
  const b = g.bob;
  if (g.state !== 'idle' && g.state !== 'charging') {
    const by = b.y + b.sink;
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(tip.x, tip.y + bend);
    ctx.quadraticCurveTo((tip.x + b.x) / 2, Math.max(tip.y, by) + (g.state === 'reeling' ? 0 : 30), b.x, by);
    ctx.stroke();
    if (g.state !== 'flying') {
      ctx.beginPath(); ctx.moveTo(b.x, by); ctx.lineTo(b.x, WATER + 70); ctx.stroke();
      ctx.strokeStyle = '#ccc'; ctx.beginPath(); ctx.arc(b.x + 3, WATER + 72, 4, 0, Math.PI); ctx.stroke();
    }
    ctx.fillStyle = '#e74c3c'; ctx.beginPath(); ctx.arc(b.x, by, 6, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, by, 6, 0, Math.PI); ctx.fill();
    if (g.state === 'bite') {
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      for (let r = 0; r < 3; r++) { ctx.beginPath(); ctx.ellipse(b.x, WATER, 10 + r * 8 + (g.t * 40) % 8, 3 + r, 0, 0, 7); ctx.stroke(); }
    }
  }

  for (const f of fish) drawFish(f.x, f.y, f.sp, f.dir, f.phase);
  if (g.state === 'reeling') {
    drawFish(b.x + Math.sin(g.t * 7) * 15, WATER + 40 + g.dist * 60, g.hooked.sp, Math.sin(g.t * 2) > 0 ? 1 : -1, g.t * 15);
  }
}

function drawUI() {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(10, 10, 170, 58);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif';
  ctx.fillText(`Punkty: ${g.score}`, 20, 32);
  ctx.font = '13px sans-serif';
  ctx.fillText(`Ryby: ${g.catches}   Rekord: ${g.best}`, 20, 54);

  ctx.textAlign = 'center';
  const hint = {
    idle: 'Przytrzymaj, aby naładować rzut',
    charging: 'Puść, aby zarzucić!',
    waiting: 'Czekaj... (dotknij, aby zwinąć)',
    bite: 'BRANIE! Dotknij!',
    reeling: 'Trzymaj = zwijaj, puść gdy linka czerwona',
    caught: 'Dotknij, aby łowić dalej',
    lost: 'Dotknij, aby spróbować ponownie',
  }[g.state];
  if (hint) {
    ctx.font = g.state === 'bite' ? 'bold 24px sans-serif' : '15px sans-serif';
    ctx.fillStyle = g.state === 'bite' ? '#ffeb3b' : '#fff';
    ctx.fillText(hint, W / 2, H - 30);
  }
  if (g.msgT > 0) {
    ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = `rgba(255,255,255,${Math.min(1, g.msgT)})`;
    ctx.fillText(g.msg, W / 2, WATER + 40);
  }
  if (g.state === 'charging') bar(W / 2 - 80, H - 70, 160, g.power, '#4caf50', 'Siła');
  if (g.state === 'reeling') {
    bar(W / 2 - 80, H - 90, 160, Math.min(1, g.tension), g.tension > 0.75 ? '#e53935' : '#ffb300', 'Napięcie');
    bar(W / 2 - 80, H - 65, 160, 1 - Math.min(1, g.dist), '#29b6f6', 'Ryba blisko');
  }
  if (g.state === 'caught' && g.hooked) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(W / 2 - 110, H * 0.62 - 50, 220, 100);
    drawFish(W / 2, H * 0.62 - 5, g.hooked.sp, 1, g.t * 4, 1.8);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif';
    ctx.fillText(g.hooked.sp.name, W / 2, H * 0.62 + 40);
  }
  ctx.textAlign = 'left';
}

function bar(x, y, w, v, color, label) {
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(x, y, w, 14);
  ctx.fillStyle = color; ctx.fillRect(x + 2, y + 2, (w - 4) * v, 10);
  ctx.fillStyle = '#fff'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText(label, x - 6, y + 11); ctx.textAlign = 'center';
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  drawScene();
  drawUI();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
