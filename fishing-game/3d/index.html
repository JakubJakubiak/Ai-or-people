<script type="module">
import * as THREE from 'three';
import { Water } from './lib/Water.js';
import { GLTFLoader } from './lib/GLTFLoader.js';

const rnd = (a, b) => a + Math.random() * (b - a);
const dummy = new THREE.Object3D();

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xfde2e4, 45, 160);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1000);
function placeCamera() {
  const portrait = innerHeight > innerWidth;
  camera.fov = portrait ? 70 : 55; camera.updateProjectionMatrix();
  camera.position.set(3, 2.6, 12.5);
  camera.lookAt(-1, 0, -6);
}
placeCamera();

// ---------- sky & light ----------
const sun = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(76), THREE.MathUtils.degToRad(195));
// gradient sky with the same colours as the 2D Sakura River version
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color(0xf7b2c4) }, mid: { value: new THREE.Color(0xfde2e4) }, bottom: { value: new THREE.Color(0xd6ecf0) },
    sunDir: { value: sun.clone().normalize() }, sunCol: { value: new THREE.Color(0xfff3c4) } },
  vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform vec3 top, mid, bottom, sunDir, sunCol; varying vec3 vDir;
    void main(){ float h = clamp(vDir.y, 0.0, 1.0);
      vec3 c = h < 0.25 ? mix(bottom, mid, h / 0.25) : mix(mid, top, (h - 0.25) / 0.75);
      float d = dot(normalize(vDir), normalize(sunDir));
      c = mix(c, sunCol, smoothstep(0.9975, 0.999, d)) + sunCol * pow(max(d, 0.0), 60.0) * 0.25;
      gl_FragColor = vec4(c, 1.0); }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), skyMat);
scene.add(sky);
const pmrem = new THREE.PMREMGenerator(renderer);
{ const envScene = new THREE.Scene(); envScene.add(sky.clone()); scene.environment = pmrem.fromScene(envScene).texture; }

scene.add(new THREE.HemisphereLight(0xffeef2, 0x6a7a55, 2.2));
const dir = new THREE.DirectionalLight(0xffe2c8, 2.8);
dir.position.copy(sun).multiplyScalar(50);
scene.add(dir);

// ---------- water (real reflections) ----------
function makeWaterNormals() {
  // procedural tileable normal map: no external texture file needed
  const N = 256, c = document.createElement('canvas'); c.width = c.height = N;
  const g2 = c.getContext('2d'), img = g2.createImageData(N, N);
  const h = (x, y) => {
    let v = 0;
    for (let k = 1; k <= 4; k++) {
      const f = k * 2 * Math.PI / N;
      v += Math.sin(x * f * (k % 2 ? 1 : 2) + k) * Math.cos(y * f * (k % 3 ? 2 : 1) + k * 1.7) / k;
    }
    return v;
  };
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const dx = h(x + 1, y) - h(x - 1, y), dy = h(x, y + 1) - h(x, y - 1);
    const i = (y * N + x) * 4;
    img.data[i] = 128 + dx * 160; img.data[i + 1] = 128 + dy * 160; img.data[i + 2] = 255; img.data[i + 3] = 255;
  }
  g2.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const water = new Water(new THREE.PlaneGeometry(400, 400), {
  textureWidth: 512, textureHeight: 512,
  waterNormals: makeWaterNormals(),
  sunDirection: sun.clone().normalize(),
  sunColor: 0xffe6d0, waterColor: 0x2f7f96, distortionScale: 3.5, fog: true, alpha: 0.7,
});
water.rotation.x = -Math.PI / 2;
water.material.uniforms.size.value = 3;
water.material.transparent = true;
water.renderOrder = 2;
scene.add(water);

// ---------- riverbed seen through the water ----------
const BED_Y = -2.2;
const bed = new THREE.Mesh(new THREE.PlaneGeometry(200, 40, 100, 20), new THREE.MeshStandardMaterial({ color: 0x8a7a55, roughness: 1 }));
bed.rotation.x = -Math.PI / 2; bed.position.set(0, BED_Y, -7);
{ const pos = bed.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i); // plane y == world -z offset
    const edge = Math.min(1, Math.abs(y) / 20);
    pos.setZ(i, Math.sin(pos.getX(i) * 0.4) * 0.15 + Math.cos(y * 0.7) * 0.1 + edge * edge * 2.4);
  }
  bed.geometry.computeVertexNormals(); }
scene.add(bed);
const stoneGeo = new THREE.DodecahedronGeometry(0.5, 0);
const stoneMat = new THREE.MeshStandardMaterial({ color: 0x77736b, roughness: 0.9, flatShading: true });
const stones = new THREE.InstancedMesh(stoneGeo, stoneMat, 160);
for (let i = 0; i < 160; i++) {
  dummy.position.set(rnd(-40, 40), BED_Y + 0.1, rnd(-20, 7));
  dummy.rotation.set(rnd(0, 3), rnd(0, 3), rnd(0, 3)); dummy.scale.set(rnd(0.4, 1.4), rnd(0.3, 0.7), rnd(0.4, 1.2));
  dummy.updateMatrix(); stones.setMatrixAt(i, dummy.matrix);
  stones.setColorAt(i, new THREE.Color().setHSL(0.08, 0.1, rnd(0.3, 0.55)));
}
scene.add(stones);
const weedGeo = new THREE.ConeGeometry(0.06, 1.6, 3); weedGeo.translate(0, 0.8, 0);
const WEEDS = 300;
const weeds = new THREE.InstancedMesh(weedGeo, new THREE.MeshStandardMaterial({ color: 0x2f7a3d }), WEEDS);
const weedBase = Array.from({ length: WEEDS }, () => ({ x: rnd(-40, 40), z: rnd(-19, 7), s: rnd(0.5, 1.3), ph: rnd(0, 6) }));
scene.add(weeds);
function updateWeeds(t) {
  weedBase.forEach((w, i) => {
    dummy.position.set(w.x, BED_Y, w.z); dummy.rotation.set(Math.sin(t + w.ph) * 0.25, 0, Math.cos(t * 0.8 + w.ph) * 0.2);
    dummy.scale.set(1, w.s, 1); dummy.updateMatrix(); weeds.setMatrixAt(i, dummy.matrix);
  });
  weeds.instanceMatrix.needsUpdate = true;
}
// soft light rays under the surface
const caustic = new THREE.Mesh(new THREE.PlaneGeometry(200, 40), new THREE.MeshBasicMaterial({ color: 0xbff6ff, transparent: true, opacity: 0.06, depthWrite: false }));
caustic.rotation.x = -Math.PI / 2; caustic.position.set(0, BED_Y + 0.05, -7); scene.add(caustic);

// ---------- banks ----------
const grassMat = new THREE.MeshStandardMaterial({ color: 0x7fa36a, roughness: 1 });
const dirtMat = new THREE.MeshStandardMaterial({ color: 0x3f4a26, roughness: 1 });
const nearBank = new THREE.Mesh(new THREE.BoxGeometry(200, 2, 30), dirtMat);
nearBank.position.set(0, -0.4, 24.4); scene.add(nearBank);

const nearGrass = new THREE.Mesh(new THREE.BoxGeometry(200, 0.2, 30), new THREE.MeshStandardMaterial({ color: 0x4f6e32, roughness: 1 }));
nearGrass.position.set(0, 0.7, 24.4); scene.add(nearGrass);
const farBank = new THREE.Mesh(new THREE.BoxGeometry(200, 3, 40), grassMat);
farBank.position.set(0, 0, -42); scene.add(farBank);
for (let i = 0; i < 9; i++) {
  const hill = new THREE.Mesh(new THREE.SphereGeometry(14 + i % 3 * 5, 16, 10), new THREE.MeshStandardMaterial({ color: 0x8fae7e }));
  hill.scale.y = 0.45; hill.position.set(-80 + i * 20, 0, -60 - (i % 2) * 10); scene.add(hill);
}

// ---------- red japanese bridge ----------
const red = new THREE.MeshStandardMaterial({ color: 0xc0392b, roughness: 0.6 });
const bridge = new THREE.Group();
const span = 32, rise = 4, segs = 24;
const archPt = t => new THREE.Vector3(0, Math.sin(t * Math.PI) * rise + 0.6, -span / 2 + t * span);
for (let i = 0; i < segs; i++) {
  const a = archPt(i / segs), b = archPt((i + 1) / segs);
  const len = a.distanceTo(b), mid = a.clone().add(b).multiplyScalar(0.5);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.35, len + 0.05), red);
  deck.position.copy(mid); deck.lookAt(b); bridge.add(deck);
  for (const s of [-1.6, 1.6]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.18, 1.1, 0.18), red);
    post.position.set(s, a.y + 0.6, a.z); bridge.add(post);
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, len + 0.05), red);
    rail.position.set(s, mid.y + 1.1, mid.z); rail.lookAt(b.x + s, b.y + 1.1, b.z); bridge.add(rail);
  }
}
for (const t of [0.25, 0.5, 0.75]) {
  const p = archPt(t);
  const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, p.y + 2, 10), red);
  pillar.position.set(0, (p.y - 2) / 2, p.z); bridge.add(pillar);
}
bridge.position.set(-14, 0, -6);
scene.add(bridge);

// ---------- sakura trees ----------
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3a2e, roughness: 1 });
const blossomMats = [0xf8bbd0, 0xf48fb1, 0xfce4ec].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9, flatShading: true }));
const blossomGeo = new THREE.IcosahedronGeometry(1, 1);
const blossoms = [];
// procedural sakura: recursive branches, blossom clouds at the branch tips
const puffGeo = new THREE.IcosahedronGeometry(1, 1);
const puffMat = new THREE.MeshStandardMaterial({ roughness: 0.85 });
puffMat.onBeforeCompile = sh => {
  sh.uniforms.uTime = grassUniforms.uTime;
  sh.vertexShader = 'uniform float uTime;\nvarying float vUp;\nvarying vec3 vWN;\n' + sh.vertexShader.replace('#include <begin_vertex>', `
    #include <begin_vertex>
    vec3 ip = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
    float w = sin(uTime * 1.3 + ip.x * 0.8 + ip.z * 0.5) * 0.06 + sin(uTime * 2.7 + ip.y * 2.0) * 0.03;
    transformed += vec3(w, w * 0.4, w * 0.6) * (0.6 + position.y * 0.4);
    vUp = normalize(mat3(instanceMatrix) * normal).y;
    vWN = normalize(mat3(modelMatrix) * mat3(instanceMatrix) * normal);`);
  sh.fragmentShader = 'varying float vUp;\nvarying vec3 vWN;\n' + sh.fragmentShader.replace('#include <color_fragment>', `
    #include <color_fragment>
    diffuseColor.rgb *= mix(0.72, 1.18, vUp * 0.5 + 0.5);`).replace('#include <emissivevertex_fragment>', '').replace('#include <output_fragment>', '#include <output_fragment>').replace('#include <dithering_fragment>', `
    #include <dithering_fragment>
    float rim = pow(1.0 - abs(dot(normalize(vWN), normalize(cameraPosition - vec3(0.0))) ), 2.0);
    gl_FragColor.rgb += vec3(1.0, 0.75, 0.85) * rim * 0.12;`);
};
const UP = new THREE.Vector3(0, 1, 0);
function sakura(x, z, s = 1) {
  const t = new THREE.Group();
  const crown = new THREE.Group(); t.add(crown);
  const tips = [];
  function branch(from, dir, len, rad, depth) {
    const to = from.clone().addScaledVector(dir, len);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rad * 0.65, rad, len, 7), trunkMat);
    m.position.copy(from).add(to).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(UP, dir);
    (depth === 0 ? t : crown).add(m);
    if (depth >= 3) { tips.push(to); return; }
    const n = depth === 0 ? 4 : 3;
    for (let i = 0; i < n; i++) {
      const yaw = (i / n) * Math.PI * 2 + rnd(-0.4, 0.4) + depth;
      const pitch = rnd(0.45, 0.85) + depth * 0.12;
      const d = new THREE.Vector3(Math.sin(pitch) * Math.cos(yaw), Math.cos(pitch), Math.sin(pitch) * Math.sin(yaw));
      d.lerp(dir, 0.3).normalize();
      branch(to, d, len * rnd(0.62, 0.78), rad * 0.6, depth + 1);
    }
  }
  branch(new THREE.Vector3(), new THREE.Vector3(rnd(-0.1, 0.1), 1, rnd(-0.1, 0.1)).normalize(), 3.0 * s, 0.4 * s, 0);
  // blossom clouds
  const perTip = 18, puffs = new THREE.InstancedMesh(puffGeo, puffMat, tips.length * perTip);
  const pink = [0xffd1df, 0xf8bbd0, 0xf48fb1, 0xfce4ec, 0xffe4ee];
  let k = 0;
  for (const tip of tips) {
    for (let j = 0; j < perTip; j++) {
      dummy.position.set(tip.x + rnd(-1.1, 1.1) * s, tip.y + rnd(-0.5, 0.7) * s, tip.z + rnd(-1.1, 1.1) * s);
      dummy.rotation.set(rnd(0, 3), rnd(0, 3), rnd(0, 3));
      dummy.scale.setScalar(rnd(0.4, 0.75) * s); dummy.updateMatrix();
      puffs.setMatrixAt(k, dummy.matrix);
      puffs.setColorAt(k++, new THREE.Color(pink[(Math.random() * pink.length) | 0]));
    }
    const marker = new THREE.Object3D(); marker.position.copy(tip); crown.add(marker); blossoms.push(marker);
  }
  puffs.name = 'blossom';
  crown.add(puffs);
  t.userData.crown = crown;
  t.position.set(x, 0.7, z); t.userData.s = s;
  scene.add(t);
  return t;
}
const sakuraTrees = [sakura(12, 10.5, 1.2), sakura(-24, 11, 1.3), sakura(18, 13, 1.1),
  sakura(-30, -24, 1.5), sakura(-8, -25, 1.3), sakura(10, -26, 1.6), sakura(28, -24, 1.4)];

// ---------- grass shader: thin curved blades, colour gradient, wind on the GPU ----------
function bladeGeometry() {
  // 5 segments, tapering to a point, bent forward a little
  const segs = 5, w = 0.045, h = 1, pos = [], uv = [], idx = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs, half = w * (1 - t) * 0.5, bend = t * t * 0.25;
    pos.push(-half, t * h, bend, half, t * h, bend);
    uv.push(0, t, 1, t);
    if (i < segs) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx); geo.computeVertexNormals();
  return geo;
}
const grassUniforms = { uTime: { value: 0 } };
const grassMatShader = new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.85 });
grassMatShader.onBeforeCompile = sh => {
  sh.uniforms.uTime = grassUniforms.uTime;
  sh.vertexShader = 'uniform float uTime;\nvarying float vH;\n' + sh.vertexShader.replace('#include <begin_vertex>', `
    #include <begin_vertex>
    vH = uv.y;
    vec3 ip = vec3(instanceMatrix[3][0], 0.0, instanceMatrix[3][2]);
    float gust = sin(uTime * 1.6 + ip.x * 0.35 + ip.z * 0.6) * 0.5 + sin(uTime * 3.1 + ip.x * 1.3) * 0.2;
    float bendK = uv.y * uv.y;
    transformed.x += gust * 0.22 * bendK;
    transformed.z += (gust * 0.12 - 0.04) * bendK;`);
  sh.fragmentShader = 'varying float vH;\n' + sh.fragmentShader.replace('#include <color_fragment>', `
    #include <color_fragment>
    vec3 root = vec3(0.10, 0.22, 0.07), tipC = vec3(0.55, 0.78, 0.32);
    diffuseColor.rgb *= mix(root, tipC, smoothstep(0.0, 1.0, vH)) * 1.6;`);
};
const BLADES = 14000;
const grass = new THREE.InstancedMesh(bladeGeometry(), grassMatShader, BLADES);
for (let i = 0; i < BLADES; i++) {
  const x = rnd(-14, 16), z = rnd(9.35, 13.2);
  const nearEdge = 1 - Math.min(1, (z - 9.4) / 0.8); // shorter at the water edge
  const h = rnd(0.25, 0.6) * (1 - nearEdge * 0.6);
  dummy.position.set(x, 0.8, z);
  dummy.rotation.set(rnd(-0.15, 0.15), rnd(0, Math.PI * 2), rnd(-0.15, 0.15));
  dummy.scale.set(rnd(0.8, 1.4), h, 1); dummy.updateMatrix();
  grass.setMatrixAt(i, dummy.matrix);
  grass.setColorAt(i, new THREE.Color().setHSL(0.25 + rnd(-0.03, 0.04), 0.5, rnd(0.45, 0.65)));
}
scene.add(grass);
function updateGrass(t) { grassUniforms.uTime.value = t; }

// ---------- optional Blender models ----------
// Export from Blender as glTF Binary (.glb) to 3d/models/. If a file is missing, the built-in shapes stay.
const loader = new GLTFLoader();
function useModel(url, replace) {
  loader.load(url, gltf => {
    gltf.scene.traverse(o => { if (o.isMesh) o.material.side = THREE.FrontSide; });
    replace(gltf.scene);
  }, undefined, () => {});
}
useModel('models/fish.glb', m => { fishProto = m; });  // model should face +X

/* ---------- Blender models from the Sakura River project (models/tree.glb, models/bridge.glb) ----------
   The models carry no normals and name their parts by material ("red", "wood"...) and by tree part
   (Tree_<v>_bark / _blossom / _crown). Blossom shader ported from Sakura River: flower clusters painted on cards,
   wind sway, flutter and fading of cards seen edge-on. If a file is missing, the code-built versions stay. */
const TAU = Math.PI * 2;
async function loadParts(url) {
  const gltf = await new Promise((ok, fail) => loader.load(url, ok, undefined, fail));
  const parts = [];
  gltf.scene.traverse(o => { if (o.isMesh) {
    const geo = o.geometry.clone(); geo.computeVertexNormals();   // local geometry: in the .glb the variants stand side by side
    parts.push({ geo, mat: o.material.name, name: o.name });
  } });
  return parts;
}
const folU = { uTime: grassUniforms.uTime, uSway: { value: 1 } };
const blossomTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d'); let sd = 7; const r = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
  const flower = (x, y, sz, rot, inner, outer) => { g.save(); g.translate(x, y); g.rotate(rot);
    for (let k = 0; k < 5; k++) { g.rotate(TAU / 5); const gr = g.createRadialGradient(0, -sz * 0.15, 0, 0, -sz * 0.5, sz * 0.75); gr.addColorStop(0, inner); gr.addColorStop(1, outer);
      const w = 0.5; g.fillStyle = gr; g.beginPath(); g.moveTo(0, 0); g.bezierCurveTo(sz * w, -sz * 0.3, sz * w * 0.9, -sz * 0.95, 0.06 * sz, -sz * 0.92);
      g.lineTo(0, -sz * 0.8); g.lineTo(-0.06 * sz, -sz * 0.92); g.bezierCurveTo(-sz * w * 0.9, -sz * 0.95, -sz * w, -sz * 0.3, 0, 0); g.fill(); }
    g.fillStyle = '#ee7fa8'; g.beginPath(); g.arc(0, 0, sz * 0.15, 0, TAU); g.fill();
    g.fillStyle = '#ffe9a8'; for (let k = 0; k < 6; k++) { g.beginPath(); g.arc(Math.cos(k) * sz * 0.2, Math.sin(k) * sz * 0.2, sz * 0.035, 0, TAU); g.fill(); }
    g.restore(); };
  const twig = (x0, y0, x1, y1, wdt) => { g.strokeStyle = '#5b3b3a'; g.lineCap = 'round'; g.lineWidth = wdt; g.beginPath(); g.moveTo(x0, y0);
    g.quadraticCurveTo((x0 + x1) / 2 + (r() - 0.5) * 40, (y0 + y1) / 2 + (r() - 0.5) * 40, x1, y1); g.stroke(); };
  const bud = (x, y, sz, rot) => { g.save(); g.translate(x, y); g.rotate(rot); g.fillStyle = '#f08ab0'; g.beginPath(); g.ellipse(0, -sz * 0.4, sz * 0.32, sz * 0.55, 0, 0, TAU); g.fill();
    g.fillStyle = '#7a4a3e'; g.beginPath(); g.ellipse(0, sz * 0.15, sz * 0.18, sz * 0.22, 0, 0, TAU); g.fill(); g.restore(); };
  const leaf = (x, y, sz, rot, col) => { g.save(); g.translate(x, y); g.rotate(rot); g.fillStyle = col; g.beginPath(); g.moveTo(0, 0);
    g.bezierCurveTo(sz * 0.45, -sz * 0.3, sz * 0.3, -sz * 0.9, 0, -sz * 1.15); g.bezierCurveTo(-sz * 0.3, -sz * 0.9, -sz * 0.45, -sz * 0.3, 0, 0); g.fill(); g.restore(); };

}
function startReel() {
  g.hooked = g.biter; g.biter = null;
  scene.remove(g.hooked.m); fish.splice(fish.indexOf(g.hooked), 1);
  g.tension = 0.3; g.dist = 1; g.state = 'reeling';
}
function clearTrophy() { if (g.trophy) { scene.remove(g.trophy); g.trophy = null; } }

function update(dt) {
  g.t += dt;
  const t = g.t;
  water.material.uniforms.time.value += dt * 0.6;
  if (fish.length < 9 && Math.random() < dt * 0.5) spawnFish(false);

  const hookZ = g.bob.z, hookX = g.bob.x;
  for (let i = fish.length - 1; i >= 0; i--) {
    const f = fish[i];
    f.phase += dt * 8;
    const lure = g.state === 'waiting' && !g.biter && Math.hypot(f.x - hookX, f.z - hookZ) < 7;
    if (lure) {
      f.interest += dt * rnd(0.2, 0.7);
      const dx = hookX - f.x, dz = hookZ - f.z;
      f.x += dx * dt * 0.7; f.z += dz * dt * 0.7;
      f.m.rotation.y = Math.atan2(-dz, dx);
      if (f.interest > 1 && Math.hypot(dx, dz) < 0.6) { g.biter = f; g.state = 'bite'; g.biteT = 0.95 - f.sp.fight * 0.15; }
    } else if (f !== g.biter) {
      f.x += f.dir * f.speed * dt;
      f.z += Math.sin(f.phase * 0.05) * 0.3 * dt;
      f.z = Math.min(RIVER_NEAR - 1, Math.max(RIVER_FAR + 2, f.z));
      f.m.rotation.y = f.dir > 0 ? 0 : Math.PI;
    }
    f.m.position.set(f.x, f === g.biter || (g.state === 'waiting' && f.interest > 0) ? THREE.MathUtils.lerp(f.m.position.y, -0.5, 0.05) : f.m.userData.depth + Math.sin(f.phase * 0.1) * 0.1, f.z);
    f.m.userData.tail.rotation.y = Math.sin(f.phase) * 0.5;
    if (Math.abs(f.x) > 32) { scene.remove(f.m); fish.splice(i, 1); }
  }

  let tilt = REST_TILT;
  if (g.state === 'charging') { g.power = Math.min(1, g.power + dt * 0.9); tilt = REST_TILT + g.power * 1.2; }
  if (g.state === 'flying') {
    g.vel.y -= 12 * dt; g.bob.addScaledVector(g.vel, dt);
    if (g.bob.y <= 0) { g.bob.y = 0; g.state = 'waiting'; ripple(g.bob.x, g.bob.z, 1.5); say('Czekaj na branie...', 1.5); }
  }
  g.sink = 0;
  if (g.state === 'waiting') g.sink = Math.sin(t * 2) * 0.03;
  if (g.state === 'bite') {
    g.sink = -0.15 + Math.sin(t * 30) * 0.08;
    if (Math.random() < dt * 6) ripple(g.bob.x, g.bob.z, 0.8);
    if ((g.biteT -= dt) <= 0) { g.biter.interest = -3; g.biter.dir *= -1; g.biter = null; g.state = 'waiting'; say('Uciekła! Za wolno.'); }
  }
  if (g.state === 'reeling') {
    const f = g.hooked.sp;
    const pull = (Math.sin(t * (2 + f.fight)) * 0.5 + 0.6) * f.fight;
    if (g.holding) { g.tension += dt * (0.25 + pull * 0.45); g.dist -= dt * 0.18 / (0.6 + f.fight * 0.4); }
    else { g.tension = Math.max(0, g.tension - dt * 0.55); g.dist = Math.min(1.2, g.dist + dt * 0.04 * f.fight); }
    // bobber dragged towards the bank as the fish comes closer, wobbling sideways
    const tip = tipPos();
    const startZ = g.bob.z;
    g.bob.z += ((tip.z - 1.5) * (1 - Math.max(0, g.dist)) + startZ * Math.max(0, g.dist) - startZ) * dt * 2;
    g.bob.x += Math.sin(t * 3) * f.fight * dt;
    g.sink = -0.1 + Math.sin(t * 12) * 0.06;
    if (Math.random() < dt * 4) ripple(g.bob.x, g.bob.z, 0.6);
    tilt = REST_TILT + 0.35 + g.tension * 0.35;
    if (g.tension >= 1) { g.state = 'lost'; say('Linka pękła!', 2.5); }
    else if (g.dist >= 1.2) { g.state = 'lost'; say('Ryba się zerwała!', 2.5); }
    else if (g.dist <= 0) {
      g.state = 'caught'; g.score += f.pts; g.catches++;
      if (g.score > g.best) { g.best = g.score; try { localStorage.setItem('fish3d-best', g.best); } catch (e) {} }
      say(`Złowiono: ${f.name}! +${f.pts}`, 3);
      g.trophy = fishModel(f, false); g.trophy.scale.setScalar(1.4); scene.add(g.trophy); g.trophyT = 0;
      ripple(g.bob.x, g.bob.z, 2);
    }
  }
  if (g.state === 'caught' && g.trophy) {
    // fish jumps out of the water and hangs on the line, wriggling
    g.trophyT = Math.min(1, g.trophyT + dt * 1.5);
    const tip = tipPos();
    g.bob.lerp(new THREE.Vector3(tip.x, tip.y - 2.2, tip.z - 0.5), dt * 3);
    g.trophy.position.set(g.bob.x, g.bob.y - 0.3 - g.hooked.sp.len * 0.5, g.bob.z);
    g.trophy.rotation.set(0, t * 0.8, Math.PI / 2 + Math.sin(t * 9) * 0.3);
    tilt = REST_TILT + 0.5;
  }
  rodPivot.rotation.x += (tilt - rodPivot.rotation.x) * Math.min(1, dt * 10);
  rodPivot.updateMatrixWorld(true);

  // line & bobber
  const tip = tipPos();
  const hanging = g.state === 'idle' || g.state === 'charging';
  if (hanging) {
    const swing = Math.sin(t * 2.2) * 0.08;
    g.bob.set(tip.x + swing, tip.y - 1.1, tip.z + Math.cos(t * 1.7) * 0.05);
  }
  const showLine = true;
  line.visible = bobber.visible = showLine;
  if (showLine) {
    bobber.position.set(g.bob.x, g.bob.y + (hanging ? 0 : g.sink + 0.05), g.bob.z);
    const bobberTie = bobber.position.clone().add(bobberLineOffset);
    const sag = hanging || g.state === 'reeling' || g.state === 'caught' ? 0.02 : 1.2;
    for (let i = 0; i < linePts.length; i++) {
      const k = i / (linePts.length - 1);
      linePts[i].lerpVectors(tip, bobberTie, k);
      linePts[i].y -= Math.sin(k * Math.PI) * sag;
    }
    lineGeo.setFromPoints(linePts);
  }

  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i]; r.userData.t += dt;
    const s = 0.2 + r.userData.t * 1.5 * r.userData.size;
    r.scale.set(s, s, s); r.material.opacity = 0.5 * (1 - r.userData.t / 1.5);
    if (r.userData.t > 1.5) { scene.remove(r); r.geometry.dispose(); ripples.splice(i, 1); }
  }
  sakuraTrees.forEach((tr, i) => { const c = tr.userData.crown; if (c) c.rotation.set(Math.sin(t * 0.7 + i) * 0.012, 0, Math.sin(t * 0.9 + i * 2) * 0.015); });
  updatePetals(dt, t);
  updateGrass(t);
  updateWeeds(t);
  caustic.material.opacity = 0.05 + Math.sin(t * 1.3) * 0.02;
  updateUI(dt);
}

const HINTS = {
  idle: 'Przytrzymaj, aby naładować rzut', charging: 'Puść, aby zarzucić!', flying: '',
  waiting: 'Czekaj... (dotknij, aby zwinąć)', bite: 'BRANIE! Dotknij!',
  reeling: 'Trzymaj = zwijaj, puść gdy linka czerwona', caught: 'Dotknij, aby łowić dalej', lost: 'Dotknij, aby spróbować ponownie',
};
function setBar(id, v, color) {
  const el = $(id); el.style.display = 'block';
  const i = el.querySelector('i'); i.style.width = Math.max(0, Math.min(1, v)) * 100 + '%';
  if (color) i.style.background = color;
}
function updateUI(dt) {
  $('score').textContent = `Punkty: ${g.score}`;
  $('stats').textContent = `Ryby: ${g.catches} · Rekord: ${g.best}`;
  $('hint').textContent = HINTS[g.state];
  $('hint').className = g.state === 'bite' ? 'bite' : '';
  if (g.msgT > 0) g.msgT -= dt;
  $('msg').style.opacity = g.msgT > 0 ? 1 : 0;
  for (const id of ['powerBar', 'tensionBar', 'distBar']) $(id).style.display = 'none';
  if (g.state === 'charging') setBar('powerBar', g.power);
  if (g.state === 'reeling') {
    setBar('tensionBar', g.tension, g.tension > 0.75 ? '#e53935' : '#ffb300');
    setBar('distBar', 1 - g.dist);
  }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); placeCamera();
});

window.game = g; // handy for debugging/tests

// Export the built-in models as .glb (open http://localhost:8000/3d/ and call exportModels() in the console)
window.exportModels = async () => {
  const { GLTFExporter } = await import('./lib/GLTFExporter.js');
  const exporter = new GLTFExporter();
  const toGlb = obj => new Promise((ok, err) => exporter.parse(obj, ok, err, { binary: true }));
  const out = {};
  const b = bridge.clone(); b.position.set(0, 0, 0); b.visible = true;
  out['bridge.glb'] = await toGlb(b);
  const tree = sakura(0, 0, 1); scene.remove(tree); tree.position.set(0, 0, 0);
  out['sakura.glb'] = await toGlb(tree);
  const fishM = fishModel(SPECIES.find(x => x.name === 'Koi'), false);
  out['fish.glb'] = await toGlb(fishM);
  const rodM = new THREE.Group(); rodM.add(rod.clone());
  const tip = new THREE.Object3D(); tip.name = 'tip'; tip.position.y = rodLen; rodM.add(tip);
  rodM.children[0].visible = true;
  out['rod.glb'] = await toGlb(rodM);
  const bob = new THREE.Group(); bob.add(bTop.clone(), bBot.clone());
  const tie = new THREE.Object3D(); tie.name = 'line'; tie.position.y = 0.34; bob.add(tie);
  out['bobber.glb'] = await toGlb(bob);
  const b64 = {};
  for (const [k, v] of Object.entries(out)) {
    let bin = ''; const u = new Uint8Array(v);
    for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    b64[k] = btoa(bin);
  }
  return b64;
};
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  update(Math.min(0.05, clock.getDelta()));
  renderer.render(scene, camera);
});
</script>
